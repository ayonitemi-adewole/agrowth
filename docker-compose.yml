services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrowth
      POSTGRES_PASSWORD: agrowth
      POSTGRES_DB: agrowth
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrowth']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
