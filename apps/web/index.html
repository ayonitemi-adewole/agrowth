<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agrowth</title>
    <meta
      name="description"
      content="Verifiable farm finance: field visits, cycles, vouchers and settlement."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installing the app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15803d" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Agrowth" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      The splash screen. Its styles live here, not in the app's CSS, so it shows on the very
      first paint, before any script or stylesheet has loaded. React replaces the markup in
      #root when it starts, and src/components/SplashScreen.tsx uses the same classes to keep
      it up until the app is ready.
    -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1rem;
        background:
          radial-gradient(48rem 32rem at 50% 38%, oklch(0.95 0.035 155), transparent 70%), #fafafa;
        color: #18181b;
        font-family: 'Inter Variable', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        animation: splash-in 240ms ease-out;
      }
      .splash-mark {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, oklch(0.7 0.16 152), oklch(0.5 0.14 150));
        box-shadow:
          0 16px 36px -12px oklch(0.45 0.12 152 / 0.55),
          inset 0 1px 0 rgb(255 255 255 / 0.25);
        animation: splash-breathe 2.4s ease-in-out infinite;
      }
      .splash-mark svg {
        width: 58%;
        height: 58%;
        overflow: visible;
      }
      .splash-leaf {
        transform-box: fill-box;
        animation: splash-sway 2.4s ease-in-out infinite;
      }
      .splash-leaf.right {
        transform-origin: 0% 100%;
      }
      .splash-leaf.left {
        transform-origin: 100% 100%;
        animation-delay: -1.2s;
      }
      .splash-name {
        font-size: 1.625rem;
        font-weight: 650;
        letter-spacing: -0.025em;
        line-height: 1.2;
      }
      .splash-tag {
        margin-top: 0.25rem;
        font-size: 0.875rem;
        color: #71717a;
      }
      .splash-bar {
        position: relative;
        width: 8.5rem;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: oklch(0.9 0.06 155);
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: oklch(0.53 0.14 150);
        animation: splash-slide 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* Inside the app, between screens: the page area only, shown after a beat so quick loads don't flicker. */
      .splash.splash-inline {
        position: static;
        z-index: auto;
        min-height: 55vh;
        gap: 1rem;
        background: none;
        opacity: 0;
        animation: splash-in 240ms ease-out 180ms forwards;
      }
      .splash-inline .splash-mark {
        width: 3rem;
        height: 3rem;
        border-radius: 0.875rem;
      }
      .splash-inline .splash-bar {
        width: 6rem;
      }
      /* Lifting after a sign-in, sign-out or account switch: fade, then it's removed. */
      .splash.splash-leaving {
        pointer-events: none;
        animation: splash-out 220ms ease-in forwards;
      }
      @keyframes splash-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes splash-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes splash-sway {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-7deg);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .splash *,
        .splash-bar::after {
          animation: none !important;
        }
        .splash.splash-inline {
          opacity: 1;
        }
        .splash-bar::after {
          width: 100%;
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-live="polite">
        <div class="splash-mark" aria-hidden="true">
          <svg
            viewBox="6.5 4.5 20 23"
            fill="none"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M16 26V13" />
            <path class="splash-leaf right" d="M16 13c0-4 3-7 7-7 0 4-3 7-7 7Z" />
            <path class="splash-leaf left" d="M16 17c0-3.5-2.6-6-6-6 0 3.5 2.6 6 6 6Z" />
          </svg>
        </div>
        <div>
          <div class="splash-name">Agrowth</div>
          <div class="splash-tag">Verifiable farm finance</div>
        </div>
        <div class="splash-bar" aria-hidden="true"></div>
        <span class="splash-sr">Loading Agrowth…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
